# Production compose for tiny-mr-schijf.optidigi.nl on the optidigi VPS.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: retro-schijff:latest
    container_name: retro-schijff
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.retro-schijff.rule=Host(`tiny-mr-schijf.optidigi.nl`)"
      - "traefik.http.routers.retro-schijff.entrypoints=websecure"
      - "traefik.http.routers.retro-schijff.tls.certresolver=letsencrypt"
      - "traefik.http.routers.retro-schijff.service=retro-schijff"
      - "traefik.http.services.retro-schijff.loadbalancer.server.port=3000"
      - "traefik.http.routers.retro-schijff.middlewares=hsts@docker"
    networks:
      - proxy
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

networks:
  proxy:
    external: true
    name: proxy